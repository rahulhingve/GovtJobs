[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "govjobs"
version = "0.1.0"
description = "CLI tool to track Indian government permanent jobs open to BTech/BE graduates"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GovJobs Developer" }
]
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "pdfplumber>=0.11.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jobs = "govjobs.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["govjobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
