# Recruiter Registry for GovJobs
# Test set of 14 sources proving the pipeline across all categories

- name: "Union Public Service Commission (UPSC)"
  category: "Central exams and boards"
  level: "central"
  sector: "civil_and_engineering_services"
  list_url: "https://upsc.gov.in/recruitment/recruitment-advertisement"
  type: "html_list"
  verify_ssl: true
  enabled: true
  selectors:
    row: "table tbody tr"
    title: "td:nth-child(2)"
    link: "td:nth-child(2) a"
    pdf: "td:nth-child(3) a"
    date: "td:nth-child(4)"

